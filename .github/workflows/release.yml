name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ github.workspace }}/adsbanish.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/adsbanish.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/adsbanish_v${{ steps.version.outputs.VERSION }}.apk

      - name: Copy APK to release folder
        run: |
          cp app/build/outputs/apk/release/adsbanish_v${{ steps.version.outputs.VERSION }}.apk \
             release/adsbanish_v${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ADSBanish v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/adsbanish_v${{ steps.version.outputs.VERSION }}.apk
